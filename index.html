<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulator de Geologie Structurală</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            user-select: none; 
            -webkit-user-select: none; 
            touch-action: manipulation;
        }
        canvas { touch-action: none; }

        /* Stiluri dedicate pentru modul mobil Landscape (înălțime mică de ecran) */
        @media (orientation: landscape) and (max-height: 550px) {
            body {
                overflow: hidden !important;
                height: 100vh !important;
            }
            #main-workspace {
                display: flex !important;
                flex-direction: row !important;
                height: calc(100vh - 46px) !important;
                padding: 4px 8px !important;
                gap: 8px !important;
                overflow: hidden !important;
            }
            #canvas-wrapper {
                flex: 1 1 65% !important;
                height: 100% !important;
                display: flex !important;
                flex-direction: column !important;
                padding: 6px !important;
            }
            #canvas-container {
                flex: 1 1 auto !important;
                height: auto !important;
                min-height: 0 !important;
            }
            #controls-sidebar {
                flex: 0 0 35% !important;
                max-width: 380px !important;
                height: 100% !important;
                overflow-y: auto !important;
                padding-right: 4px !important;
            }
            .landscape-compact-header {
                padding-top: 4px !important;
                padding-bottom: 4px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Compact cu Badge de Versiune v2.2.0 -->
    <header class="bg-slate-900 border-b border-slate-800 px-3 sm:px-4 py-2 sm:py-2.5 flex justify-between items-center shadow-lg sticky top-0 z-50 landscape-compact-header">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 p-1.5 sm:p-2 rounded-lg text-white shadow-md">
                <i class="fa-solid fa-mountain text-xs sm:text-base"></i>
            </div>
            <div>
                <div class="flex items-center space-x-1.5 sm:space-x-2">
                    <h1 class="text-xs sm:text-base font-bold tracking-wide text-white leading-tight">TECTONO-LAB</h1>
                    <span id="app-version-badge" class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-[9px] font-mono px-1.5 py-0.5 rounded font-bold">v2.2.0</span>
                </div>
                <p class="hidden sm:block text-[10px] text-slate-400">Simulator Tectonic & Relief</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleErosion()" id="btn-toggle-erosion" class="bg-cyan-600 text-white px-2 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1 transition-all">
                <i id="icon-toggle-erosion" class="fa-solid fa-wind text-[10px]"></i>
                <span id="label-toggle-erosion" class="text-[11px] sm:text-xs">Eroziune</span>
            </button>
            <button onclick="resetAll()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-2 py-1 rounded-lg border border-slate-700 transition-all flex items-center space-x-1" title="Resetare">
                <i class="fa-solid fa-rotate-right text-[10px]"></i>
                <span class="text-[11px] sm:text-xs">Reset</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace (Flexibil pe mobil, Grid pe ecrane mari) -->
    <main id="main-workspace" class="flex-1 max-w-[1700px] w-full mx-auto p-2 sm:p-4 md:p-6 flex flex-col lg:grid lg:grid-cols-4 gap-3 sm:gap-4">

        <!-- Canvas Display Area (Permanent vizibil în stânga când este landscape) -->
        <div id="canvas-wrapper" class="order-1 lg:order-2 lg:col-span-3 bg-slate-900 border border-slate-800 rounded-xl sm:rounded-2xl shadow-xl p-2 sm:p-4 flex flex-col justify-between">
            
            <!-- Badges Bar -->
            <div class="flex justify-between items-center mb-1.5 sm:mb-2 text-xs">
                <div class="flex items-center space-x-1.5">
                    <span id="process-title-badge" class="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold border border-indigo-500/30">Extensiune</span>
                    <span id="erosion-badge" class="bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold border border-cyan-500/30">Eroziune Activă</span>
                </div>
                <div class="text-[10px] text-slate-400">
                    <span><i class="fa-solid fa-hand-pointer text-amber-400 mr-1"></i> Sapă pe ecran</span>
                </div>
            </div>

            <!-- Canvas Viewport adaptiv -->
            <div id="canvas-container" class="w-full bg-slate-950 rounded-lg sm:rounded-xl border border-slate-800 relative overflow-hidden flex items-center justify-center h-[260px] sm:h-[420px] lg:h-[540px]">
                <canvas id="geologyCanvas" class="w-full h-full cursor-crosshair"></canvas>
            </div>

            <!-- Status Bar Compact -->
            <div class="mt-1.5 sm:mt-2 bg-slate-950 border border-slate-800 px-2.5 py-1.5 rounded-lg sm:rounded-xl flex items-center justify-between text-[10px] sm:text-xs">
                <div class="flex items-center space-x-3 sm:space-x-6">
                    <div><span class="text-slate-400">Throw:</span> <span id="stat-throw" class="font-bold text-cyan-400">38.9m</span></div>
                    <div><span class="text-slate-400">Heave:</span> <span id="stat-heave" class="font-bold text-amber-400">22.5m</span></div>
                    <div><span class="text-slate-400">Slip:</span> <span id="stat-net-slip" class="font-bold text-emerald-400">45.0m</span></div>
                </div>
                <div class="flex items-center space-x-2">
                    <div id="stat-dip-type" class="hidden sm:block text-slate-400 font-mono text-[10px]">Cădere spre Dreapta</div>
                    <span class="text-[9px] font-mono text-slate-500 bg-slate-900 px-1 py-0.5 rounded border border-slate-800">v2.2.0</span>
                </div>
            </div>
        </div>

        <!-- Controls Sidebar (În dreapta când este landscape, scrollabil independent) -->
        <div id="controls-sidebar" class="order-2 lg:order-1 lg:col-span-1 space-y-2.5 sm:space-y-4">
            
            <!-- 1. Tectonică de Falie -->
            <div class="bg-slate-900 border border-slate-800 p-2.5 sm:p-4 rounded-xl sm:rounded-2xl shadow-xl space-y-2.5">
                <h2 class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center">
                    <i class="fa-solid fa-gears text-indigo-400 mr-1.5"></i> 1. Tectonică
                </h2>
                
                <div class="grid grid-cols-2 gap-1.5 sm:gap-2">
                    <button onclick="setProcess('normal')" id="btn-proc-normal" class="process-btn bg-indigo-600 text-white p-2 rounded-lg sm:rounded-xl text-xs font-semibold text-left border border-indigo-500 shadow-sm flex flex-col justify-between h-12 sm:h-16">
                        <span class="flex items-center justify-between w-full">
                            <span>Normală</span>
                            <i class="fa-solid fa-circle-check text-[10px]"></i>
                        </span>
                        <span class="text-[9px] text-indigo-200 font-normal">Extensie</span>
                    </button>
                    
                    <button onclick="setProcess('reverse')" id="btn-proc-reverse" class="process-btn bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg sm:rounded-xl text-xs font-semibold text-left border border-slate-700 flex flex-col justify-between h-12 sm:h-16">
                        <span class="flex items-center justify-between w-full">
                            <span>Inversă</span>
                            <i class="fa-solid fa-circle text-[10px] opacity-0"></i>
                        </span>
                        <span class="text-[9px] text-slate-400 font-normal">Compresiune</span>
                    </button>
                </div>

                <div class="space-y-2 pt-1">
                    <div>
                        <div class="flex justify-between text-[11px] mb-0.5">
                            <span class="text-slate-300">Dip (&theta;):</span>
                            <span id="val-dip" class="font-bold text-indigo-400">60°</span>
                        </div>
                        <input type="range" id="slider-dip" min="-90" max="90" value="60" oninput="updateParameters()" class="w-full accent-indigo-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] mb-0.5">
                            <span class="text-slate-300">Slip:</span>
                            <span id="val-slip" class="font-bold text-emerald-400">45 m</span>
                        </div>
                        <input type="range" id="slider-slip" min="0" max="140" value="45" oninput="updateParameters()" class="w-full accent-emerald-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                </div>

                <button onclick="animateFault()" class="w-full bg-indigo-600/30 hover:bg-indigo-600 border border-indigo-500/50 text-indigo-200 hover:text-white font-medium py-1.5 rounded-lg text-xs transition-all flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-play text-[9px]"></i>
                    <span>Animează Deplasarea</span>
                </button>
            </div>

            <!-- 2. Relief & Eroziune -->
            <div class="bg-slate-900 border border-slate-800 p-2.5 sm:p-4 rounded-xl sm:rounded-2xl shadow-xl space-y-2.5">
                <h2 class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center">
                    <i class="fa-solid fa-wind text-cyan-400 mr-1.5"></i> 2. Relief & Nivelare
                </h2>

                <!-- Nivelare -->
                <div class="space-y-1">
                    <div class="flex justify-between text-[11px]">
                        <span class="text-slate-400">Nivelare (Sus/Jos):</span>
                        <span id="val-level-cut" class="font-bold text-emerald-400">0 m</span>
                    </div>
                    <input type="range" id="slider-level-cut" min="-200" max="200" value="0" oninput="applyElevationShift()" class="w-full accent-emerald-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    <div class="grid grid-cols-2 gap-1.5 pt-0.5">
                        <button onclick="shiftProfileVertical(-25)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 rounded-lg text-xs border border-slate-700 flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-arrow-up text-[9px]"></i>
                            <span>Sus 25m</span>
                        </button>
                        <button onclick="shiftProfileVertical(25)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 rounded-lg text-xs border border-slate-700 flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-arrow-down text-[9px]"></i>
                            <span>Jos 25m</span>
                        </button>
                    </div>
                </div>

                <!-- Sculptare relief aleator -->
                <div class="pt-1.5 border-t border-slate-800/80 space-y-1.5">
                    <div class="flex justify-between text-[11px]">
                        <span class="text-slate-400">Amplitudine Văi:</span>
                        <span id="val-erode-depth" class="font-bold text-cyan-400">45 m</span>
                    </div>
                    <input type="range" id="slider-erode-depth" min="10" max="150" value="45" oninput="document.getElementById('val-erode-depth').innerText = this.value + ' m'" class="w-full accent-cyan-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    <button onclick="generateRandomErosion()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-1.5 rounded-lg text-xs transition-all flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-shuffle text-[10px]"></i>
                        <span>Generează Văi Aleatoare</span>
                    </button>
                </div>

                <!-- Litologie -->
                <div class="pt-1.5 border-t border-slate-800">
                    <h3 class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Litologie</h3>
                    <div id="strat-legend" class="grid grid-cols-2 sm:grid-cols-1 gap-1 text-[9px] sm:text-[11px]"></div>
                </div>

            </div>
        </div>

    </main>

    <!-- JavaScript Engine -->
    <script>
        const APP_VERSION = "2.2.0";
        console.log(`TECTONO-LAB inițializat la versiunea: ${APP_VERSION}`);

        const canvas = document.getElementById('geologyCanvas');
        const ctx = canvas.getContext('2d');

        let simState = {
            process: 'normal',
            dip: 60,
            slip: 45,
            animating: false,
            erosionActive: true,
            baseCutOffset: 0,
            topoProfile: [],
            rawNoise: []
        };

        const strata = [
            { name: "Sisturi Cristaline", color: "#1e293b", stroke: "#0f172a", thickness: 110 },
            { name: "Calcare Mezozoice", color: "#334155", stroke: "#1e293b", thickness: 75 },
            { name: "Gresii de Tarcău", color: "#b45309", stroke: "#92400e", thickness: 70 },
            { name: "Marne și Argile", color: "#1d4ed8", stroke: "#1e40af", thickness: 60 },
            { name: "Depozite Cuaternare", color: "#64748b", stroke: "#475569", thickness: 45 }
        ];

        let isCarving = false;

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;

            if (simState.topoProfile.length !== Math.round(rect.width)) {
                initTopoProfile();
            }
            drawSimulation();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            setTimeout(resizeCanvas, 150);
        });

        function initLegend() {
            const legendContainer = document.getElementById('strat-legend');
            legendContainer.innerHTML = '';
            strata.slice().reverse().forEach((layer) => {
                legendContainer.innerHTML += `
                    <div class="flex items-center justify-between p-1 bg-slate-950/70 rounded-md border border-slate-800">
                        <div class="flex items-center space-x-1.5 overflow-hidden">
                            <span class="w-2 h-2 rounded-sm flex-shrink-0" style="background-color: ${layer.color}; border: 1px solid ${layer.stroke}"></span>
                            <span class="text-slate-300 truncate">${layer.name}</span>
                        </div>
                        <span class="text-slate-500 font-mono text-[9px] flex-shrink-0">${layer.thickness}m</span>
                    </div>
                `;
            });
        }

        function setProcess(procType) {
            simState.process = procType;
            const btnNormal = document.getElementById('btn-proc-normal');
            const btnReverse = document.getElementById('btn-proc-reverse');
            const badge = document.getElementById('process-title-badge');

            if (procType === 'normal') {
                btnNormal.className = "process-btn bg-indigo-600 text-white p-2 rounded-lg sm:rounded-xl text-xs font-semibold text-left border border-indigo-500 shadow-sm flex flex-col justify-between h-12 sm:h-16";
                btnNormal.querySelector('.fa-circle-check, .fa-circle').className = "fa-solid fa-circle-check text-[10px]";
                
                btnReverse.className = "process-btn bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg sm:rounded-xl text-xs font-semibold text-left border border-slate-700 flex flex-col justify-between h-12 sm:h-16";
                btnReverse.querySelector('.fa-circle-check, .fa-circle').className = "fa-solid fa-circle text-[10px] opacity-0";
                badge.innerText = "Extensiune";
            } else {
                btnReverse.className = "process-btn bg-indigo-600 text-white p-2 rounded-lg sm:rounded-xl text-xs font-semibold text-left border border-indigo-500 shadow-sm flex flex-col justify-between h-12 sm:h-16";
                btnReverse.querySelector('.fa-circle-check, .fa-circle').className = "fa-solid fa-circle-check text-[10px]";
                
                btnNormal.className = "process-btn bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg sm:rounded-xl text-xs font-semibold text-left border border-slate-700 flex flex-col justify-between h-12 sm:h-16";
                btnNormal.querySelector('.fa-circle-check, .fa-circle').className = "fa-solid fa-circle text-[10px] opacity-0";
                badge.innerText = "Compresiune";
            }
            drawSimulation();
        }

        function updateParameters() {
            simState.dip = parseInt(document.getElementById('slider-dip').value);
            simState.slip = parseInt(document.getElementById('slider-slip').value);

            document.getElementById('val-dip').innerText = simState.dip + '°';
            document.getElementById('val-slip').innerText = simState.slip + ' m';

            const dipTypeBadge = document.getElementById('stat-dip-type');
            if (simState.dip === 0) dipTypeBadge.innerText = "Orizontală / Decollement";
            else if (Math.abs(simState.dip) === 90) dipTypeBadge.innerText = "Verticală";
            else if (simState.dip > 0) dipTypeBadge.innerText = "Cădere spre Dreapta";
            else dipTypeBadge.innerText = "Cădere spre Stânga";

            drawSimulation();
        }

        function getBaseGroundY() {
            const H = parseFloat(canvas.style.height) || 420;
            const totalThickness = strata.reduce((acc, l) => acc + l.thickness, 0);
            const anchorY = H * 0.52;
            const baseY = anchorY + (totalThickness * 0.42);
            return baseY - totalThickness;
        }

        function initTopoProfile() {
            const W = Math.round(parseFloat(canvas.style.width) || 700);
            const groundY = getBaseGroundY();
            simState.topoProfile = new Array(W).fill(groundY + simState.baseCutOffset);
            simState.rawNoise = new Array(W).fill(0);
        }

        function toggleErosion() {
            simState.erosionActive = !simState.erosionActive;
            const btn = document.getElementById('btn-toggle-erosion');
            const badge = document.getElementById('erosion-badge');

            if (simState.erosionActive) {
                btn.className = "bg-cyan-600 text-white px-2 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1 transition-all";
                badge.className = "bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold border border-cyan-500/30";
                badge.innerText = "Eroziune Activă";
            } else {
                btn.className = "bg-slate-800 text-slate-400 border border-slate-700 px-2 py-1 rounded-lg text-xs font-semibold flex items-center space-x-1 transition-all";
                badge.className = "bg-slate-700/30 text-slate-400 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold border border-slate-700";
                badge.innerText = "Eroziune Oprită";
            }
            drawSimulation();
        }

        function applyElevationShift() {
            simState.baseCutOffset = parseInt(document.getElementById('slider-level-cut').value);
            document.getElementById('val-level-cut').innerText = (simState.baseCutOffset > 0 ? `+${simState.baseCutOffset}` : `${simState.baseCutOffset}`) + ' m';
            recalculateTopoProfile();
            drawSimulation();
        }

        function shiftProfileVertical(amount) {
            simState.baseCutOffset = Math.max(-200, Math.min(200, simState.baseCutOffset + amount));
            document.getElementById('slider-level-cut').value = simState.baseCutOffset;
            document.getElementById('val-level-cut').innerText = (simState.baseCutOffset > 0 ? `+${simState.baseCutOffset}` : `${simState.baseCutOffset}`) + ' m';
            recalculateTopoProfile();
            drawSimulation();
        }

        function recalculateTopoProfile() {
            const W = Math.round(parseFloat(canvas.style.width) || 700);
            const groundY = getBaseGroundY();
            for (let x = 0; x < W; x++) {
                simState.topoProfile[x] = groundY + simState.baseCutOffset + (simState.rawNoise[x] || 0);
            }
        }

        function generateRandomErosion() {
            const W = Math.round(parseFloat(canvas.style.width) || 700);
            const depth = parseInt(document.getElementById('slider-erode-depth').value);

            const f1 = 0.005;
            const f2 = 0.012;
            const phase1 = Math.random() * Math.PI * 2;
            const phase2 = Math.random() * Math.PI * 2;

            for (let x = 0; x < W; x++) {
                let wave = Math.sin(x * f1 + phase1) * 0.65 + Math.sin(x * f2 + phase2) * 0.35;
                simState.rawNoise[x] = ((wave + 1) / 2) * depth;
            }

            recalculateTopoProfile();
            drawSimulation();
        }

        function carveAtPoint(clientX, clientY) {
            if (!simState.erosionActive) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = Math.round(clientX - rect.left);
            const mouseY = clientY - rect.top;
            const radius = 30;
            const W = Math.round(parseFloat(canvas.style.width) || 700);

            for (let x = Math.max(0, mouseX - radius); x <= Math.min(W - 1, mouseX + radius); x++) {
                let dist = Math.abs(x - mouseX);
                let factor = Math.cos((dist / radius) * (Math.PI / 2));
                let targetY = mouseY * factor + (simState.topoProfile[x]) * (1 - factor);
                
                if (targetY > simState.topoProfile[x]) {
                    let diff = targetY - simState.topoProfile[x];
                    simState.rawNoise[x] = (simState.rawNoise[x] || 0) + diff;
                    simState.topoProfile[x] = targetY;
                }
            }
            drawSimulation();
        }

        canvas.addEventListener('mousedown', (e) => { isCarving = true; carveAtPoint(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (isCarving) carveAtPoint(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isCarving = false; });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isCarving = true;
                carveAtPoint(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isCarving && e.touches.length === 1) {
                carveAtPoint(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', () => { isCarving = false; });

        function animateFault() {
            if (simState.animating) return;
            simState.animating = true;

            const targetSlip = parseInt(document.getElementById('slider-slip').value);
            const startTime = performance.now();
            const duration = 1000;

            function step(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                
                simState.slip = targetSlip * ease;
                drawSimulation();

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    simState.slip = targetSlip;
                    simState.animating = false;
                    drawSimulation();
                }
            }
            requestAnimationFrame(step);
        }

        function resetAll() {
            simState.slip = 0;
            simState.baseCutOffset = 0;
            document.getElementById('slider-slip').value = 0;
            document.getElementById('val-slip').innerText = '0 m';
            document.getElementById('slider-level-cut').value = 0;
            document.getElementById('val-level-cut').innerText = '0 m';
            initTopoProfile();
            drawSimulation();
        }

        function drawSimulation() {
            const W = parseFloat(canvas.style.width) || 700;
            const H = parseFloat(canvas.style.height) || 420;
            ctx.clearRect(0, 0, W, H);

            let effectiveDip = simState.dip;
            if (effectiveDip === 0) effectiveDip = 0.001;

            const dipRad = (effectiveDip * Math.PI) / 180;
            const anchorX = W * 0.46;
            const anchorY = H * 0.52;
            const getFaultX = (y) => anchorX + (y - anchorY) / Math.tan(dipRad);

            let s = simState.slip;
            let dx = s * Math.cos(Math.abs(dipRad)) * (effectiveDip >= 0 ? 1 : -1);
            let dy = s * Math.sin(Math.abs(dipRad));

            if (simState.process === 'reverse') {
                dx = -dx;
                dy = -dy;
            }

            document.getElementById('stat-throw').innerText = Math.abs(dy).toFixed(1) + 'm';
            document.getElementById('stat-heave').innerText = Math.abs(dx).toFixed(1) + 'm';
            document.getElementById('stat-net-slip').innerText = s.toFixed(1) + 'm';

            // Grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 45) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let y = 0; y < H; y += 45) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }

            const totalThickness = strata.reduce((acc, l) => acc + l.thickness, 0);
            const baseY = anchorY + (totalThickness * 0.42);

            let layerBounds = [];
            let currY = baseY;
            for (let i = 0; i < strata.length; i++) {
                let yBot = currY;
                let yTop = currY - strata[i].thickness;
                layerBounds.push({ layer: strata[i], yTop, yBot });
                currY = yTop;
            }

            // 1. FOOTWALL
            layerBounds.forEach(({ layer, yTop, yBot }) => {
                const xTopFault = getFaultX(yTop);
                const xBotFault = getFaultX(yBot);

                ctx.fillStyle = layer.color;
                ctx.strokeStyle = layer.stroke;
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ctx.moveTo(0, yTop);
                ctx.lineTo(xTopFault, yTop);
                ctx.lineTo(xBotFault, yBot);
                ctx.lineTo(0, yBot);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // 2. HANGING WALL
            layerBounds.forEach(({ layer, yTop, yBot }) => {
                const yTopTrans = yTop + dy;
                const yBotTrans = yBot + dy;
                const xTopFaultTrans = getFaultX(yTop) + dx;
                const xBotFaultTrans = getFaultX(yBot) + dx;

                ctx.fillStyle = layer.color;
                ctx.strokeStyle = layer.stroke;
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ctx.moveTo(xTopFaultTrans, yTopTrans);
                ctx.lineTo(W, yTopTrans);
                ctx.lineTo(W, yBotTrans);
                ctx.lineTo(xBotFaultTrans, yBotTrans);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // 3. Plan de Falie
            const faultY1 = Math.min(layerBounds[strata.length - 1].yTop, layerBounds[strata.length - 1].yTop + dy) - 50;
            const faultY2 = Math.max(baseY, baseY + dy) + 50;
            const faultX1 = getFaultX(faultY1);
            const faultX2 = getFaultX(faultY2);

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(faultX1, faultY1);
            ctx.lineTo(faultX2, faultY2);
            ctx.stroke();
            ctx.setLineDash([]);

            // 4. Mască de Eroziune
            const intW = Math.round(W);
            if (simState.erosionActive && simState.topoProfile.length >= intW) {
                ctx.fillStyle = '#020617';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(W, 0);
                ctx.lineTo(W, simState.topoProfile[intW - 1]);

                for (let x = intW - 1; x >= 0; x--) {
                    ctx.lineTo(x, simState.topoProfile[x]);
                }
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, simState.topoProfile[0]);
                for (let x = 1; x < intW; x++) {
                    ctx.lineTo(x, simState.topoProfile[x]);
                }
                ctx.stroke();
            }

            // 5. Etichete
            ctx.font = 'bold 10px Inter, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText("FOOTWALL", 15, baseY - totalThickness - 10);

            ctx.fillStyle = '#cbd5e1';
            let hwLabelY = baseY - totalThickness - 10 + dy;
            ctx.fillText("HANGING WALL", W - 95, Math.max(30, hwLabelY));
        }

        window.onload = () => {
            initLegend();
            resizeCanvas();
        };
    </script>
</body>
</html>
