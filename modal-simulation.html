<!-- Modal: Editor Stratigrafie & Deformare (Cutare) -->
<div id="simulation-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
        
        <!-- Header Modal cu Badge de Versiune v1.1.0 -->
        <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/90">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-layer-group text-indigo-400"></i>
                <div class="flex items-center space-x-2">
                    <h3 id="simulation-modal-title" class="font-bold text-white text-sm sm:text-base">Editor Stratigrafie & Cutare</h3>
                    <span id="simulation-modal-version" class="bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-[9px] font-mono px-1.5 py-0.5 rounded font-bold">v1.1.0</span>
                </div>
            </div>
            <button onclick="closeSimulationModal()" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Conținut cu Scroll -->
        <div class="p-3 sm:p-4 overflow-y-auto space-y-4 flex-1">
            
            <!-- Secțiunea 1: Parametri de Cutare Tectonică (Compresiune) -->
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-3">
                <div class="flex items-center justify-between">
                    <span id="sim-modal-folding-title" class="text-xs font-bold text-purple-300 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-water text-purple-400 mr-1.5"></i> Compresiune & Cutare Tectonică
                    </span>
                    <span id="modal-val-fold-badge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 border border-purple-500/30">0%</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <div>
                        <div class="flex justify-between text-[11px] mb-1">
                            <span id="sim-modal-lbl-shortening" class="text-slate-300">Scurtare orizontală:</span>
                            <span id="modal-val-shortening" class="font-bold text-purple-400">0%</span>
                        </div>
                        <input type="range" id="modal-slider-shortening" min="0" max="60" value="0" oninput="updateModalFoldingParams()" class="w-full accent-purple-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-[11px] mb-1">
                            <span id="sim-modal-lbl-wavelength" class="text-slate-300">Lungime de undă (&lambda;):</span>
                            <span id="modal-val-wavelength" class="font-bold text-pink-400">220 m</span>
                        </div>
                        <input type="range" id="modal-slider-wavelength" min="80" max="450" value="220" oninput="updateModalFoldingParams()" class="w-full accent-pink-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Secțiunea 2: Coloana Stratigrafică -->
            <div>
                <div class="flex justify-between items-center mb-2 px-1">
                    <span id="sim-modal-strata-title" class="text-xs font-bold text-slate-400 uppercase tracking-wider">Strate Geologice (de jos în sus)</span>
                    <span class="text-[10px] text-slate-500">Grosime (m)</span>
                </div>
                <div class="space-y-2" id="strata-edit-list"></div>
            </div>

        </div>

        <!-- Footer Modal -->
        <div class="p-3 border-t border-slate-800 bg-slate-900/90 flex justify-between items-center">
            <button onclick="addNewStratum()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition-all">
                <i class="fa-solid fa-plus"></i>
                <span id="btn-add-stratum">Adaugă Strat Nou</span>
            </button>
            <div class="flex space-x-2">
                <button onclick="closeSimulationModal()" id="btn-cancel-simulation" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-xl text-xs font-semibold transition-all">Anulează</button>
                <button onclick="saveSimulationStrataChanges()" id="btn-apply-simulation" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-xl text-xs font-semibold shadow-md transition-all">Aplică pe Model</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SIMULATION_MODAL_VERSION = "1.1.0";

    // Păstrăm valori temporare pentru cutare în modal
    let tempFoldShortening = 0;
    let tempFoldWavelength = 220;

    function syncFoldingControls() {
        if (typeof simState !== 'undefined') {
            tempFoldShortening = simState.foldShortening || 0;
            tempFoldWavelength = simState.foldWavelength || 220;
        }

        const sliderS = document.getElementById('modal-slider-shortening');
        const sliderW = document.getElementById('modal-slider-wavelength');
        if (sliderS) sliderS.value = tempFoldShortening;
        if (sliderW) sliderW.value = tempFoldWavelength;

        updateModalFoldingLabels();
    }

    function updateModalFoldingLabels() {
        const valS = document.getElementById('modal-val-shortening');
        const valW = document.getElementById('modal-val-wavelength');
        const badge = document.getElementById('modal-val-fold-badge');

        if (valS) valS.innerText = tempFoldShortening + '%';
        if (valW) valW.innerText = tempFoldWavelength + ' m';
        if (badge) badge.innerText = tempFoldShortening + '%';
    }

    function updateModalFoldingParams() {
        const sliderS = document.getElementById('modal-slider-shortening');
        const sliderW = document.getElementById('modal-slider-wavelength');
        if (sliderS) tempFoldShortening = parseInt(sliderS.value);
        if (sliderW) tempFoldWavelength = parseInt(sliderW.value);

        updateModalFoldingLabels();

        // Aplicare directă opțională în simState pentru preview live dacă modelul este vizibil în fundal
        if (typeof simState !== 'undefined') {
            simState.foldShortening = tempFoldShortening;
            simState.foldWavelength = tempFoldWavelength;
            if (typeof drawSimulation === 'function') drawSimulation();
        }
    }

    function renderSimulationEditorList() {
        const list = document.getElementById('strata-edit-list');
        if (!list || typeof tempStrataEdit === 'undefined' || typeof iugsChronodata === 'undefined') return;
        
        list.innerHTML = '';
        const t = (typeof translations !== 'undefined' && typeof currentLang !== 'undefined') ? translations[currentLang] : { stratumPlaceholder: 'Nume Strat...' };

        tempStrataEdit.slice().reverse().forEach((layer, origIdxReversed) => {
            const actualIdx = tempStrataEdit.length - 1 - origIdxReversed;
            const color = typeof getStratumColor === 'function' ? getStratumColor(layer.age) : '#718096';
            const border = typeof getStratumBorder === 'function' ? getStratumBorder(layer.age) : '#4a5568';

            list.innerHTML += `
                <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div class="w-6 h-6 rounded-lg flex-shrink-0 border" style="background-color: ${color}; border-color: ${border}"></div>
                    
                    <div class="flex-1 w-full sm:w-auto">
                        <input type="text" value="${layer.name}" onchange="tempStrataEdit[${actualIdx}].name = this.value" placeholder="${t.stratumPlaceholder}" class="w-full bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="w-full sm:w-52 flex-shrink-0">
                        <select onchange="tempStrataEdit[${actualIdx}].age = this.value; renderSimulationEditorList();" class="w-full bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-xs text-indigo-300 focus:outline-none focus:border-indigo-500">
                            ${iugsChronodata.map(item => {
                                const isRo = (typeof currentLang !== 'undefined' && currentLang === 'ro');
                                const optName = isRo ? item.nameRo : item.nameEn;
                                const optRank = isRo ? item.rankRo : item.rankEn;
                                const isSelected = layer.age.toLowerCase() === item.nameEn.toLowerCase() || layer.age.toLowerCase() === item.nameRo.toLowerCase();
                                return `<option value="${item.nameEn}" ${isSelected ? 'selected' : ''}>${optName} (${optRank})</option>`;
                            }).join('')}
                        </select>
                    </div>

                    <div class="flex items-center space-x-1.5 w-full sm:w-28 flex-shrink-0">
                        <input type="number" min="10" max="250" value="${layer.thickness}" onchange="tempStrataEdit[${actualIdx}].thickness = parseInt(this.value) || 30" class="w-full bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg text-xs text-white text-center focus:outline-none focus:border-indigo-500">
                        <span class="text-[10px] text-slate-400">m</span>
                    </div>

                    <button onclick="removeSimulationStratum(${actualIdx})" class="text-rose-400 hover:text-rose-300 p-1 px-2 text-xs rounded bg-slate-900 border border-slate-800" title="Delete">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;
        });
    }

    function addNewStratum() {
        if (typeof tempStrataEdit === 'undefined') return;
        const isRo = (typeof currentLang !== 'undefined' && currentLang === 'ro');
        tempStrataEdit.push({
            name: isRo ? "Strat Nou" : "New Layer",
            age: "Cretaceous",
            thickness: 50
        });
        renderSimulationEditorList();
    }

    function removeSimulationStratum(index) {
        if (typeof tempStrataEdit === 'undefined') return;
        if (tempStrataEdit.length <= 1) {
            const isRo = (typeof currentLang !== 'undefined' && currentLang === 'ro');
            alert(isRo ? "Trebuie să existe cel puțin un strat în secțiune." : "At least one layer must remain in section.");
            return;
        }
        tempStrataEdit.splice(index, 1);
        renderSimulationEditorList();
    }

    function saveSimulationStrataChanges() {
        if (typeof tempStrataEdit === 'undefined') return;
        strata = JSON.parse(JSON.stringify(tempStrataEdit));
        
        if (typeof simState !== 'undefined') {
            simState.foldShortening = tempFoldShortening;
            simState.foldWavelength = tempFoldWavelength;
        }

        closeSimulationModal();
        if (typeof initLegend === 'function') initLegend();
        if (typeof initTopoProfile === 'function') initTopoProfile();
        if (typeof drawSimulation === 'function') drawSimulation();
    }

    // Inițializare la deschidere/încărcare
    syncFoldingControls();
    if (typeof tempStrataEdit === 'undefined' && typeof strata !== 'undefined') {
        tempStrataEdit = JSON.parse(JSON.stringify(strata));
    }
    renderSimulationEditorList();
</script>
